name: Release

# Publishing a GitHub release (tag v1.2.3 equal to the package.json version, on a commit
# that is on main) publishes the package to npm through trusted publishing (OIDC): no
# NPM_TOKEN secret. On npmjs.com, the package's Settings → Trusted publishing must name
# this repository, the workflow file release.yml and the environment "npm".
#
# The build job has read-only access and produces the tarball; the publish job only
# downloads that tarball and publishes it, so no project code runs with id-token access.
# A release marked as a pre-release (or a version with a "-" suffix) is published under
# the "next" dist-tag instead of "latest".

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      dist-tag: ${{ steps.verify.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag equals package.json version, dated changelog entry, tag commit is on main
        id: verify
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not equal v$version (package.json)"
            exit 1
          fi
          if ! grep -Eq "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not on main"
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:package
      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --ignore-scripts --silent | tail -n 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Node 24 bundles npm 11, which supports trusted publishing (npm 11.5.1 or newer).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      - name: npm publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --provenance --access public --tag "$DIST_TAG"
